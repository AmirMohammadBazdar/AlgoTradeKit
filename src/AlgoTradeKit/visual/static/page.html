<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- v1.3.0: a phone draws the page at its own width -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlgoTradeKit — Chart Page</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681; --accent:#58a6ff;
  --hh:34px;
  --veil:rgba(13,17,23,.86); --dropbg:rgba(88,166,255,.22);       /* v1.3.0: arranging */
}
body.light{
  --bg:#ffffff; --bg2:#f6f8fa; --bg3:#eaeef2; --border:#d0d7de;
  --text:#1f2328; --text2:#57606a; --text3:#8c959f; --accent:#0969da;
  --veil:rgba(255,255,255,.86); --dropbg:rgba(9,105,218,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
     display:flex;flex-direction:column}

#hdr{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--border);
     display:flex;align-items:center;padding:0 12px;gap:14px;flex-shrink:0}
#logo{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
/* v1.3.0: the brand is a link to the repository; it looks as it did */
a#logo{text-decoration:none;cursor:pointer}
a#logo:hover{text-decoration:underline}
#page-title{font-size:12px;color:var(--text2)}
#sync-box{margin-left:auto;display:flex;align-items:center;gap:6px}
.sync-btn{height:22px;padding:0 9px;border-radius:5px;border:1px solid var(--border);
          background:transparent;color:var(--text2);font-size:10px;cursor:pointer;
          font-family:'Courier New',monospace;letter-spacing:.04em}
.sync-btn.on{background:var(--accent)22;color:var(--accent);border-color:var(--accent)55}
.sync-btn:hover:not(.on){background:var(--bg3)}

/* ── Layout: rows of cells, draggable on both axes ─────────────── */
#page{flex:1;display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;flex-direction:row;overflow:hidden;min-height:60px}
.cell{position:relative;overflow:hidden;min-width:80px;display:flex}
.cell iframe{flex:1;border:0;width:100%;height:100%;display:block}
/* The active chart is the one driving the others, so it has to be obvious.
   A 1px border at 40% alpha, drawn at the very edge next to a divider, is not:
   this is an inset ring, which reads as a highlight rather than a hairline. */
.cell::after{content:'';position:absolute;inset:0;pointer-events:none;
             box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .12s}
.cell.active::after{box-shadow:inset 0 0 0 2px var(--accent)cc}

.rdiv{height:5px;background:var(--border);cursor:row-resize;flex-shrink:0;opacity:.45}
.cdiv{width:5px;background:var(--border);cursor:col-resize;flex-shrink:0;opacity:.45}
.rdiv:hover,.cdiv:hover,.rdiv.dragging,.cdiv.dragging{opacity:1;background:var(--accent)}
.rdiv,.cdiv{touch-action:none}                 /* v1.3.0: a finger drags them too */

/* ── v1.3.0: a phone. The header shortens its title, then scrolls sideways ── */
#hdr{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#hdr::-webkit-scrollbar{display:none}
#hdr > *{flex-shrink:0}
#hdr > #page-title{flex-shrink:1;min-width:30px;white-space:nowrap;overflow:hidden;
                   text-overflow:ellipsis}
/* Upright — the window taller than wide — with no arrangement of the viewer's own
   for it: the charts of a row stack (the default only) */
body.stacked .row.multi{flex-direction:column}
body.stacked .row.multi > .cell{min-width:0;min-height:60px}
body.stacked .row.multi > .cdiv{width:auto;height:5px;cursor:row-resize}

/* ── v1.3.0: arranging. Each chart under a veil, dragged by it ── */
.veil{display:none;position:absolute;inset:0;z-index:5;background:var(--veil);
      flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;
      cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center}
body.arranging .veil{display:flex}
.veil.dragging{opacity:.45;cursor:grabbing}
.veil .vt{font-size:14px;font-weight:600;color:var(--text)}
.veil .vh{font-size:11px;color:var(--text2);max-width:320px}
#drop{display:none;position:fixed;z-index:20;pointer-events:none;border:2px solid var(--accent);
      background:var(--dropbg);border-radius:6px;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;color:var(--accent)}
#drop.show{display:flex}
#lay-reset,#lay-done{display:none}
body.arranging #lay-reset,body.arranging #lay-done{display:inline-block}
.sync-btn:disabled{opacity:.4;cursor:default}

#empty{margin:auto;color:var(--text3);font-size:12px}

/* ── Replay bar (v1.1.0) ─────────────────────────────────────── */
#rp{display:flex;align-items:center;gap:2px;margin-left:14px}
#rp-controls{display:none;align-items:center;gap:2px}
#rp-controls.open{display:flex}
#rp-clock{font-family:'Courier New',monospace;font-size:10px;color:var(--text2);
          padding:0 6px;white-space:nowrap}
#rp-speed{height:22px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);
          border-radius:4px;font-size:10px;font-family:'Courier New',monospace;cursor:pointer}
#rp-note{font-size:10px;color:var(--accent);padding-left:8px;display:none}
#rp-note.show{display:inline}
</style>
</head>
<body>

<div id="hdr">
  <a id="logo" href="https://github.com/AmirMohammadBazdar/AlgoTradeKit" target="_blank"
     rel="noopener noreferrer" title="AlgoTradeKit on GitHub">⬡ AlgoTradeKit</a>
  <span id="page-title">Chart Page</span>
  <div id="rp">
    <button class="sync-btn" id="rp-btn" onclick="replayToggle()"
            title="Bar replay — every chart on this page steps together">⏵⏵ REPLAY</button>
    <div id="rp-controls">
      <button class="sync-btn" onclick="replayToStart()" title="Back to the start bar">⏮</button>
      <button class="sync-btn" onclick="replayStep(-1)" title="One step back (Shift+←)">◀</button>
      <button class="sync-btn" id="rp-play" onclick="replayPlayPause()" title="Play / pause (Space)">▶</button>
      <button class="sync-btn" onclick="replayStep(1)" title="One step forward (Shift+→)">▶|</button>
      <select id="rp-speed" onchange="replaySetSpeed(this.value)">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="2">2x</option>
        <option value="5">5x</option><option value="10">10x</option>
      </select>
      <span id="rp-clock"></span>
      <button class="sync-btn" onclick="replayExit()" title="Leave replay (Esc)">✕</button>
    </div>
    <span id="rp-note">click a candle on any chart to start</span>
  </div>
  <div id="sync-box">
    <!-- v1.3.0: the viewer's own arrangement of the charts, kept in this browser -->
    <button class="sync-btn" id="lay-btn" onclick="arrangeToggle()"
            title="Arrange the charts: drag one onto another's side, or onto its middle to swap">⊞ LAYOUT</button>
    <button class="sync-btn" id="lay-reset" onclick="arrangeReset()"
            title="Back to the program's layout, for this screen's shape (wide or upright)">RESET</button>
    <button class="sync-btn" id="lay-done" onclick="arrangeToggle(false)">DONE</button>
    <button class="sync-btn" id="sync-time"  onclick="toggleSync('time')"  title="Scroll and zoom every chart together">TIME</button>
    <button class="sync-btn" id="sync-cross" onclick="toggleSync('crosshair')" title="Mirror the crosshair onto every chart">CROSSHAIR</button>
  </div>
</div>

<div id="page"><div id="empty">loading…</div></div>
<div id="drop"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
//  CHART PAGE SHELL
//  Owns layout, focus and synchronisation. Each chart lives in its
//  own frame, which keeps their DOM ids, legend handlers and overlay
//  canvases from colliding; the shell only relays between them.
// ═══════════════════════════════════════════════════════════════
let layout = null;
let sync   = {time: true, crosshair: true};
let activeView = null;
// The last range and crosshair relayed. A frame reports a range change on a
// later animation frame, so a flag set and cleared around the broadcast is
// already off when the echo arrives — the charts would then relay the same
// range to each other for ever. Dropping a repeat by value ends it.
let lastRange = null, lastCrosshair = null;
const SAME_TIME = (a, b) => a != null && b != null && Math.abs(a - b) < 1;
const frames = {};                     // view id → window
// v1.3.0: the edit key in the page's own address goes on to every chart in it
const editKey = new URLSearchParams(location.search).get('key');

async function loadLayout(){
  const res = await fetch('layout');
  layout = await res.json();
  document.title = layout.title ? layout.title + ' — AlgoTradeKit' : 'AlgoTradeKit';
  document.getElementById('page-title').textContent = layout.title || '';
  document.body.classList.toggle('light', layout.theme === 'light');
  sync = Object.assign({time: true, crosshair: true}, layout.sync || {});
  renderSyncButtons();
  renderLayout();
}

function titleOf(id){
  const v = (layout.views || []).find(v => v.id === id);
  return v ? v.title : id;
}

function renderLayout(){
  const page = document.getElementById('page');
  page.innerHTML = '';
  // v1.3.0: the viewer's own arrangement for this screen's shape, or the program's
  rowsNow = rowsFor(shapeNow());
  if(!rowsNow.length){
    page.innerHTML = '<div id="empty">no charts on this page</div>';
    return;
  }
  buildRows(rowsNow, makeCell);
  document.getElementById('lay-btn').style.display = rowsNow.flat().length > 1 ? '' : 'none';
  applyShape(true);

  const first = (rowsNow[0] || [])[0];
  if(first) setActive(first);
}

// A chart's cell: its frame, and the veil it is arranged by (v1.3.0)
function makeCell(id){
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.id = 'cell-' + id;
  cell.style.flex = 1;
  const f = document.createElement('iframe');
  // chrome=compact drops the frame's own header bar: one page-level header
  // is enough, and the vertical space matters when charts are stacked.
  f.src = `view?view=${encodeURIComponent(id)}&chrome=compact&title=${encodeURIComponent(titleOf(id))}`
        + (editKey ? `&key=${encodeURIComponent(editKey)}` : '');
  f.title = titleOf(id);
  f.onload = () => { frames[id] = f.contentWindow; };
  cell.appendChild(f);
  const veil = document.createElement('div');
  veil.className = 'veil';
  const name = document.createElement('div');
  name.className = 'vt'; name.textContent = titleOf(id);
  const how = document.createElement('div');
  how.className = 'vh';
  how.textContent = 'Drag it onto another chart: onto a side to go beside, above or below it, '
                  + 'onto its middle to swap places.';
  veil.appendChild(name); veil.appendChild(how);
  veil.addEventListener('pointerdown', ev => arrangeStart(ev, id));
  cell.appendChild(veil);
  return cell;
}

// Rows of cells with a divider between each two, into the page; *cellFor(id)*
// gives each cell — a new one, or the one already there, moved (v1.3.0).
function buildRows(rows, cellFor){
  const page = document.getElementById('page');
  rows.forEach((ids, ri) => {
    if(ri > 0) page.appendChild(makeDivider('rdiv'));
    const row = document.createElement('div');
    row.className = ids.length > 1 ? 'row multi' : 'row';
    row.style.flex = 1;
    page.appendChild(row);                     // in the page first: a frame moves into it
    ids.forEach((id, ci) => {
      if(ci > 0) row.appendChild(makeDivider('cdiv'));
      place(row, cellFor(id));
    });
  });
}

// A cell into a row. One already on the page is moved with its frame's state
// where the browser can (moveBefore); elsewhere the move reloads that frame.
function place(row, cell){
  if(cell.parentElement && typeof row.moveBefore === 'function'){
    try{ row.moveBefore(cell, null); return; }catch{}
  }
  row.appendChild(cell);
}

// ── Dividers ───────────────────────────────────────────────────
// Both axes work the same way: the two siblings either side of the handle
// share their combined flex, so dragging moves the boundary between them.
// v1.3.0: by mouse or finger (pointer events); between stacked charts the
// handle drags up and down, and where it is left is remembered.
function makeDivider(cls){
  const d = document.createElement('div');
  d.className = cls;
  d.addEventListener('pointerdown', ev => startDrag(ev, d));
  return d;
}

function dividerIsVertical(handle){
  if(handle.classList.contains('rdiv')) return true;
  const row = handle.parentElement;
  return document.body.classList.contains('stacked') && !!row && row.classList.contains('multi');
}

function startDrag(ev, handle){
  ev.preventDefault();
  const vertical = dividerIsVertical(handle);
  handle.classList.add('dragging');
  const before = handle.previousElementSibling, after = handle.nextElementSibling;
  if(!before || !after) return;

  const start = vertical ? ev.clientY : ev.clientX;
  const bf = parseFloat(before.style.flex) || 1;
  const af = parseFloat(after.style.flex)  || 1;
  const total = bf + af;
  const box = handle.parentElement.getBoundingClientRect();
  const span = vertical ? box.height : box.width;

  // Frames swallow the pointer once it crosses into them, so block their
  // pointer events for the duration of the drag.
  document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');

  const onMove = e => {
    const delta = ((vertical ? e.clientY : e.clientX) - start) / span * total;
    before.style.flex = Math.max(0.08, bf + delta);
    after.style.flex  = Math.max(0.08, af - delta);
  };
  const onUp = () => {
    handle.classList.remove('dragging');
    document.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    saveSizes();
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

// ═══════════════════════════════════════════════════════════════
//  ON A PHONE, AND ARRANGED BY THE VIEWER (v1.3.0)
//  Each screen shape — wide, or upright (taller than wide) — has its own
//  arrangement. With none of the viewer's own, a wide page is the program's
//  layout, and an upright one the same rows stacked, one chart under another,
//  by CSS only: turning a phone reloads nothing (ChartPage(stack_upright=False)
//  keeps them side by side). ⊞ LAYOUT lets the viewer arrange the charts as
//  they like — drag one onto another's side, or its middle to swap — and from
//  then on that shape shows their arrangement as they set it, side by side
//  included. It is this browser's, for this page's address, with the dividers'
//  places; RESET forgets it for the shape the screen has now.
// ═══════════════════════════════════════════════════════════════
const LAYOUT_KEY = 'atk.page.layout.v2';
let rowsNow = [];                      // the rows the page holds: [[view id, …], …]
let arranging = false;
let arrangeDrag = null;

function programRows(){ return ((layout && layout.rows) || []).map(r => r.slice()); }

// {rows: {wide, upright}, sizes: {wide, upright}} — each shape's own
function readArrangement(){
  try{
    const v = JSON.parse(window.localStorage.getItem(LAYOUT_KEY));
    return v && typeof v === 'object' ? v : null;
  }catch{ return null; }
}
function writeArrangement(v){
  try{ window.localStorage.setItem(LAYOUT_KEY, JSON.stringify(v)); }catch{}
}

// Saved rows over the program's: a chart the program no longer has drops out;
// one it added since goes where the program put it — beside a chart it shares a
// row with, or in a row of its own at the end.
function mergedRows(saved){
  const prog = programRows();
  const known = new Set(prog.flat());
  if(!Array.isArray(saved)) return prog;
  const seen = new Set();
  const rows = saved.filter(Array.isArray)
    .map(r => r.filter(id => typeof id === 'string' && known.has(id) && !seen.has(id)
                             && seen.add(id)))
    .filter(r => r.length);
  prog.forEach(prow => prow.forEach(id => {
    if(seen.has(id)) return;
    const mate = prow.find(m => seen.has(m));
    const row = mate ? rows.find(r => r.includes(mate)) : null;
    if(row) row.push(id); else rows.push([id]);
    seen.add(id);
  }));
  return rows;
}

function shapeNow(){ return window.innerHeight > window.innerWidth ? 'upright' : 'wide'; }

// The viewer's own arrangement for *shape*, merged with the program's, or null
function ownRows(shape){
  const saved = readArrangement();
  const rows = saved && saved.rows && saved.rows[shape];
  return Array.isArray(rows) ? mergedRows(rows) : null;
}

// Upright with no arrangement of the viewer's own: the default, stacked
function stackedByDefault(shape){
  return shape === 'upright' && !!layout && layout.stackUpright !== false && !ownRows(shape);
}

// The rows the page holds for *shape*: the viewer's, else the program's
function rowsFor(shape){ return ownRows(shape) || programRows(); }

// The arrangement as the viewer sees it: a stacked page is a column of charts
function visibleRows(shape){
  return stackedByDefault(shape) ? rowsFor(shape).flat().map(id => [id]) : rowsFor(shape);
}

// On every resize and turn: the shape's rows (the cells move only if they
// differ), whether they stack, and the dividers' places kept for that shape.
let shapeShown = null;
function applyShape(force){
  const shape = shapeNow();
  document.body.classList.toggle('upright', shape === 'upright');
  document.body.classList.toggle('stacked', stackedByDefault(shape));
  const rows = rowsFor(shape);
  if(!sameRows(rows, rowsNow)) arrangeTo(rows);
  else if(force || shape !== shapeShown) applySizes();
  shapeShown = shape;
}
window.addEventListener('resize', () => applyShape(false));

function pageRows(){
  const page = document.getElementById('page');
  return Array.from(page.children || []).filter(el => el.classList && el.classList.contains('row'));
}

function applySizes(){
  const saved = readArrangement();
  const sizes = (saved && saved.sizes && saved.sizes[shapeNow()]) || {};
  const rowFlex = sizes.rows || [], cellFlex = sizes.cells || {};
  pageRows().forEach((row, i) => { row.style.flex = Number(rowFlex[i]) > 0 ? rowFlex[i] : 1; });
  rowsNow.flat().forEach(id => {
    const cell = document.getElementById('cell-' + id);
    if(cell) cell.style.flex = Number(cellFlex[id]) > 0 ? cellFlex[id] : 1;
  });
}

function saveSizes(){
  const saved = readArrangement() || {};
  saved.sizes = saved.sizes || {};
  const cells = {};
  rowsNow.flat().forEach(id => {
    const cell = document.getElementById('cell-' + id);
    if(cell) cells[id] = parseFloat(cell.style.flex) || 1;
  });
  saved.sizes[shapeNow()] = {
    rows: pageRows().map(row => parseFloat(row.style.flex) || 1), cells};
  writeArrangement(saved);
}

// The viewer's arrangement for *shape* (null forgets it), with even sizes
function saveRows(shape, rows){
  const saved = readArrangement() || {};
  saved.rows = saved.rows || {};
  saved.sizes = saved.sizes || {};
  if(rows) saved.rows[shape] = rows; else delete saved.rows[shape];
  delete saved.sizes[shape];
  writeArrangement(saved);
}

// ⊞ LAYOUT: on, every chart wears its veil and takes no other input; off, as
// before. Not while a replay runs, and a replay does not start while it is on.
function arrangeToggle(on){
  on = on === undefined ? !arranging : !!on;
  if(on && (replay.active || replay.picking)) return;
  arranging = on;
  document.body.classList.toggle('arranging', on);
  document.getElementById('lay-btn').classList.toggle('on', on);
  document.getElementById('rp-btn').disabled = on;
  if(!on) dropShow(null);
}

// The arrangement after chart *id* is dropped on *target*'s *zone*: «swap»
// trades their places; «left» / «right» put it beside the target in its row;
// «above» / «below» in a row of its own over or under the target's row.
function rearranged(rows, id, target, zone){
  if(id === target) return rows.map(r => r.slice());
  if(zone === 'swap'){
    return rows.map(r => r.map(x => x === id ? target : x === target ? id : x));
  }
  const out = rows.map(r => r.filter(x => x !== id)).filter(r => r.length);
  const ri = out.findIndex(r => r.includes(target));
  if(ri < 0) return rows.map(r => r.slice());
  if(zone === 'left' || zone === 'right'){
    out[ri].splice(out[ri].indexOf(target) + (zone === 'right' ? 1 : 0), 0, id);
  } else {
    out.splice(ri + (zone === 'below' ? 1 : 0), 0, [id]);
  }
  return out;
}

// Rebuild the rows around the cells already there (their frames move, not
// reload, where the browser can); a new arrangement starts with even sizes.
function arrangeTo(rows){
  const page = document.getElementById('page');
  const cells = {};
  rows.flat().forEach(id => { cells[id] = document.getElementById('cell-' + id); });
  const old = Array.from(page.children || []);
  buildRows(rows, id => cells[id] || makeCell(id));
  old.forEach(el => { try{ el.remove(); }catch{} });
  rowsNow = rows.map(r => r.slice());
  applySizes();
}

function sameRows(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

// RESET: the program's layout again, for the shape the screen has now
function arrangeReset(){
  saveRows(shapeNow(), null);
  applyShape(true);
}

// Which chart, and which part of it, a point is over: the middle (30–70 % both
// ways) swaps; elsewhere the nearest side.
const DROP_LABEL = {left:'beside it, on the left', right:'beside it, on the right',
                    above:'above it', below:'below it', swap:'swap places'};
function dropAt(x, y){
  for(const id of rowsNow.flat()){
    const cell = document.getElementById('cell-' + id);
    if(!cell) continue;
    const r = cell.getBoundingClientRect();
    if(x < r.left || x > r.left + r.width || y < r.top || y > r.top + r.height) continue;
    const fx = (x - r.left) / r.width, fy = (y - r.top) / r.height;
    let zone = 'swap';
    if(!(fx > 0.3 && fx < 0.7 && fy > 0.3 && fy < 0.7)){
      const d = {left: fx, right: 1 - fx, above: fy, below: 1 - fy};
      zone = Object.keys(d).reduce((a, b) => d[a] <= d[b] ? a : b);
    }
    return {id, zone, rect: r};
  }
  return null;
}

function dropShow(drop){
  const el = document.getElementById('drop');
  if(!el) return;
  if(!drop){ el.classList.remove('show'); el.textContent = ''; return; }
  const r = drop.rect, half = {left:[0, 0, .5, 1], right:[.5, 0, .5, 1], above:[0, 0, 1, .5],
                               below:[0, .5, 1, .5], swap:[0, 0, 1, 1]}[drop.zone];
  el.style.left = (r.left + r.width * half[0]) + 'px';
  el.style.top = (r.top + r.height * half[1]) + 'px';
  el.style.width = (r.width * half[2]) + 'px';
  el.style.height = (r.height * half[3]) + 'px';
  el.textContent = DROP_LABEL[drop.zone];
  el.classList.add('show');
}

function arrangeStart(ev, id){
  if(!arranging) return;
  ev.preventDefault();
  const veil = ev.currentTarget || null;
  if(veil && veil.classList) veil.classList.add('dragging');
  arrangeDrag = {id, veil, drop: null};
  document.addEventListener('pointermove', arrangeMove);
  document.addEventListener('pointerup', arrangeEnd);
  document.addEventListener('pointercancel', arrangeCancel);
}

function arrangeMove(ev){
  if(!arrangeDrag) return;
  const drop = dropAt(ev.clientX, ev.clientY);
  arrangeDrag.drop = drop && drop.id !== arrangeDrag.id ? drop : null;
  dropShow(arrangeDrag.drop);
}

function arrangeEnd(ev){
  if(!arrangeDrag) return;
  if(ev && ev.clientX != null) arrangeMove(ev);
  const {id, drop} = arrangeDrag;
  arrangeCancel();
  if(!drop) return;
  // From what the viewer sees: on a stacked page, a column of charts
  const shape = shapeNow(), seen = visibleRows(shape);
  const rows = rearranged(seen, id, drop.id, drop.zone);
  if(sameRows(rows, seen)) return;
  saveRows(shape, rows);                          // theirs for this shape now, even sizes
  applyShape(true);
}

function arrangeCancel(){
  if(arrangeDrag && arrangeDrag.veil && arrangeDrag.veil.classList)
    arrangeDrag.veil.classList.remove('dragging');
  arrangeDrag = null;
  dropShow(null);
  document.removeEventListener('pointermove', arrangeMove);
  document.removeEventListener('pointerup', arrangeEnd);
  document.removeEventListener('pointercancel', arrangeCancel);
}

// ── Focus ──────────────────────────────────────────────────────
function setActive(id){
  activeView = id;
  document.querySelectorAll('.cell').forEach(c =>
    c.classList.toggle('active', c.id === 'cell-' + id));
  replayClock();                          // v1.3.0: in the chart in use's zones
}

// ── Time zones (v1.3.0) ────────────────────────────────────────
// Each chart tells the page the zones it uses now (the one its candles are
// stamped in, the one it shows times in); the replay's clock reads the chart in
// use's. A stamp is the source zone's wall clock written as if it were UTC.
const viewZones = {};
function zoneWall(z, ms){
  const parts = {};
  new Intl.DateTimeFormat('en-GB', {timeZone: z, year:'numeric', month:'2-digit',
    day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'})
    .formatToParts(new Date(ms)).forEach(p => { parts[p.type] = p.value; });
  return parts;
}
function zoneShift(z, ms){
  if(z === 'UTC') return 0;
  const p = zoneWall(z, ms);
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second)
         - Math.floor(ms / 1000) * 1000;
}
function zoneLabel(sec, z){
  z = z || {source: 'UTC', display: 'UTC'};
  try{
    const wall = sec * 1000;
    const instant = wall - zoneShift(z.source, wall - zoneShift(z.source, wall));
    const p = zoneWall(z.display, instant);
    return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute} ${z.display}`;
  }catch{
    return new Date(sec * 1000).toISOString().slice(0,16).replace('T',' ') + ' UTC';
  }
}

// ── Sync ───────────────────────────────────────────────────────
function renderSyncButtons(){
  document.getElementById('sync-time').classList.toggle('on', !!sync.time);
  document.getElementById('sync-cross').classList.toggle('on', !!sync.crosshair);
}

function toggleSync(which){
  sync[which] = !sync[which];
  renderSyncButtons();
  if(which === 'crosshair' && !sync.crosshair) broadcast(null, {t: 'crosshair-clear'});
}

function broadcast(fromId, msg){
  Object.entries(frames).forEach(([id, win]) => {
    if(id === fromId || !win) return;
    try{ win.postMessage(msg, '*'); }catch{}
  });
}

// ═══════════════════════════════════════════════════════════════
//  PAGE-WIDE BAR REPLAY (v1.1.0)
//  One cursor for the whole page. The frames render it; the shell
//  owns it. Stepping by the finest source timeframe on the page is
//  what keeps a 3m and a 5m chart on the same instant instead of
//  each counting its own candles.
// ═══════════════════════════════════════════════════════════════
let replay = {active:false, picking:false, cursor:null, start:null,
              playing:false, timer:null, speed:1,
              step:60, first:null, last:null};

function replayToggle(){
  if(replay.active || replay.picking) replayExit();
  else if(!arranging) replayBegin();          // v1.3.0: not while arranging
}

function replayBegin(){
  replay.picking = true;
  document.getElementById('lay-btn').disabled = true;      // v1.3.0
  document.getElementById('rp-btn').classList.add('on');
  document.getElementById('rp-note').classList.add('show');
  broadcast(null, {t:'replay-arm'});
  broadcast(null, {t:'replay-info'});      // frames answer with their extents
  replay.first = replay.last = null;
  replay.step  = null;
}

function noteReplayInfo(msg){
  // The page can only step as finely as its finest chart, and can only cover
  // the span every chart has data for.
  replay.step  = replay.step  == null ? msg.step  : Math.min(replay.step,  msg.step);
  replay.first = replay.first == null ? msg.first : Math.max(replay.first, msg.first);
  replay.last  = replay.last  == null ? msg.last  : Math.min(replay.last,  msg.last);
}

function replayPickedAt(time){
  if(!replay.picking) return;
  replay.picking = false;
  document.getElementById('rp-note').classList.remove('show');
  document.getElementById('rp-controls').classList.add('open');
  replay.active = true;
  replay.start  = time;
  replaySeek(time);
}

function replaySeek(t){
  if(!replay.active) return;
  if(replay.first != null) t = Math.max(replay.first, t);
  if(replay.last  != null) t = Math.min(replay.last,  t);
  replay.cursor = t;
  broadcast(null, {t:'replay-cursor', time:t});
  replayClock();
}

function replayClock(){
  if(!replay.active || replay.cursor == null) return;
  const known = Object.keys(viewZones);
  const z = viewZones[activeView] || (known.length ? viewZones[known[0]] : null);
  document.getElementById('rp-clock').textContent = zoneLabel(replay.cursor, z);
}

function replayStep(dir){
  if(!replay.active) return;
  const before = replay.cursor;
  replaySeek(replay.cursor + dir * (replay.step || 60));
  if(dir > 0 && replay.cursor === before) replayPause();   // ran out of data
}

function replayToStart(){ if(replay.active) replaySeek(replay.start); }
function replayPlayPause(){ replay.playing ? replayPause() : replayPlay(); }

function replayPlay(){
  if(!replay.active || replay.playing) return;
  replay.playing = true;
  document.getElementById('rp-play').textContent = '⏸';
  const tick = () => {
    if(!replay.playing) return;
    replayStep(1);
    if(replay.playing) replay.timer = setTimeout(tick, 500 / replay.speed);
  };
  replay.timer = setTimeout(tick, 500 / replay.speed);
}

function replayPause(){
  replay.playing = false;
  clearTimeout(replay.timer);
  replay.timer = null;
  document.getElementById('rp-play').textContent = '▶';
}

function replaySetSpeed(v){ replay.speed = parseFloat(v) || 1; }

function replayExit(){
  replayPause();
  replay.active = replay.picking = false;
  replay.cursor = null;
  document.getElementById('lay-btn').disabled = false;     // v1.3.0
  document.getElementById('rp-btn').classList.remove('on');
  document.getElementById('rp-note').classList.remove('show');
  document.getElementById('rp-controls').classList.remove('open');
  document.getElementById('rp-clock').textContent = '';
  broadcast(null, {t:'replay-exit'});
}

document.addEventListener('keydown', e => {
  if(!replay.active) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) return;
  if(e.key === 'Escape'){ replayExit(); e.preventDefault(); }
  else if(e.code === 'Space'){ replayPlayPause(); e.preventDefault(); }
  else if(e.shiftKey && e.key === 'ArrowRight'){ replayStep(1);  e.preventDefault(); }
  else if(e.shiftKey && e.key === 'ArrowLeft'){  replayStep(-1); e.preventDefault(); }
});

window.addEventListener('message', ev => {
  const msg = ev.data;
  if(!msg || typeof msg !== 'object' || !msg.t) return;

  // Trust only our own frames — the id has to match the window that sent it.
  const id = msg.view;
  if(!id || frames[id] !== ev.source) return;

  switch(msg.t){
    case 'focus':
      setActive(id);
      break;
    case 'range':
      // Sync by TIME, never by candle index: a 3m and a 5m chart have
      // completely different logical indices for the same instant.
      if(!sync.time) break;
      // Only the chart being used may move the others. Each chart snaps a
      // range to its own bars, so letting every chart answer back makes them
      // chase each other's rounding and shake.
      if(id !== activeView) break;
      if(lastRange && SAME_TIME(lastRange.from, msg.from)
                   && SAME_TIME(lastRange.to, msg.to)) break;
      lastRange = {from: msg.from, to: msg.to};
      broadcast(id, {t: 'range', from: msg.from, to: msg.to});
      break;
    case 'navigate':
      // The report sent one chart to a trade — or «Go to» did (v1.3.0, `keep`:
      // each chart keeps its zoom); the rest of the page follows.
      broadcast(id, msg.keep ? {t: 'navigate', time: msg.time, keep: true}
                             : {t: 'navigate', time: msg.time});
      break;
    case 'crosshair':
      if(!sync.crosshair) break;
      if(SAME_TIME(lastCrosshair, msg.time)) break;             // an echo
      lastCrosshair = msg.time;
      broadcast(id, {t: 'crosshair', time: msg.time, price: msg.price});
      break;
    case 'crosshair-clear':
      if(!sync.crosshair) break;
      broadcast(id, {t: 'crosshair-clear'});
      break;
    case 'replay-info':
      noteReplayInfo(msg);
      break;
    case 'replay-pick':
      replayPickedAt(msg.time);
      break;
    case 'layout-changed':
      loadLayout();
      break;
    case 'style':
      // A chart's colours changed in its Settings panel (v1.3.0). They are kept
      // in the browser's storage, which every frame of the page shares: the
      // others read them again. Never back to the sender.
      broadcast(id, {t: 'style'});
      break;
    case 'zones':
      // The zones a chart uses now (v1.3.0), for the replay's clock
      if(typeof msg.source === 'string' && typeof msg.display === 'string'){
        viewZones[id] = {source: msg.source, display: msg.display};
        replayClock();
      }
      break;
    case 'paste':
      // v1.3.0: a Ctrl+V in a chart the pointer has left belongs to the chart in use
      pasteInto(msg.text);
      break;
  }
});

// ── Paste (v1.3.0) ────────────────────────────────────────────
// Ctrl+V pastes a copied drawing into the chart the pointer is on — the one marked
// in use — whichever document has the keyboard: a chart passes on a paste that is
// not its own, and the page's own (its header had the keyboard) goes there too.
function pasteInto(text){
  const id = activeView || Object.keys(frames)[0];
  const win = id ? frames[id] : null;
  if(!win || typeof text !== 'string') return;
  try{ win.postMessage({t: 'paste', text}, '*'); }catch{}
}
function isCopiedDrawing(text){
  try{
    const m = JSON.parse(text);
    return !!m && typeof m === 'object' && m.atk === 'drawing';
  }catch{ return false; }
}
document.addEventListener('paste', e => {
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) return;
  let text = '';
  try{ text = e.clipboardData.getData('text/plain'); }catch{}
  if(!isCopiedDrawing(text)) return;         // anything else: the browser's own paste
  e.preventDefault();
  pasteInto(text);
});

loadLayout();
</script>
</body>
</html>
