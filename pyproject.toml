[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AlgoTradeKit"
version = "1.1.1"
description = "Algorithmic Trading Toolkit — data collection, indicators, strategy, simulation, and live trading"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Amir Mohammad Bazdar", email = "ambazdar03@gmail.com" }]
keywords = [
    "algorithmic-trading", "trading-bot", "finance", "crypto",
    "binance", "backtesting", "indicators", "quant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies (kept minimal — only what data module needs)
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "build",
    "twine",
]

# Native MetaTrader 5 transport (Windows only).  The MetaTrader5 wheel exists
# for Windows alone, so the marker keeps `pip install AlgoTradeKit[mt5]` a
# no-op everywhere else instead of an install error.  On Linux the terminal
# runs under Wine and is reached through the bridge — see MT5_WINE_SETUP.md.
mt5 = ['MetaTrader5; platform_system == "Windows"']

[project.urls]
Homepage   = "https://github.com/AmirMohammadBazdar/AlgoTradeKit"
Repository = "https://github.com/AmirMohammadBazdar/AlgoTradeKit"
Issues     = "https://github.com/AmirMohammadBazdar/AlgoTradeKit/issues"
Changelog  = "https://github.com/AmirMohammadBazdar/AlgoTradeKit/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatchling build
# ---------------------------------------------------------------------------
# Wheel: only the importable package.
[tool.hatch.build.targets.wheel]
packages = ["src/AlgoTradeKit"]

# Sdist: an EXPLICIT allow-list — only these paths are packaged. Everything
# else (private planning docs, personal strategy scripts, local settings, …)
# is excluded by construction, so nothing private can ever leak into a release
# again. Add a new public file here if the distribution needs it.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/AlgoTradeKit",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "MT5_WINE_SETUP.md",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# ---------------------------------------------------------------------------
# Black formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
# uvicorn's WebSocket implementation still calls the deprecated websockets
# legacy API, and the websockets client warns about its own ConnectionClosed
# accessor. Nothing in AlgoTradeKit can act on either, and left unfiltered they
# bury the warnings that do matter. Anything raised by our own code must stay
# visible, so these are matched by message rather than blanket-ignored.
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    "ignore:ConnectionClosed.code is deprecated:DeprecationWarning",
]
